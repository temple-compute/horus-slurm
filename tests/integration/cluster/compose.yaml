# Throwaway Slurm cluster for the integration tests. See
# docs/design/slurm-itests.md. Start it with `make integration`.
name: horus-slurm-itest

x-slurm: &slurm
  # 26.05.2
  image: giovtorres/slurm-docker-cluster@sha256:8b92cbd3bf7e51f910c7266c1dac13cf0c59059fa8db3c385bec76952a79b47b
  volumes:
    - ./slurm.conf:/etc/slurm/slurm.conf:ro
    # Same path as on the host, so files the tests write are where jobs look.
    - ${ITEST_DIR:?set ITEST_DIR}:${ITEST_DIR}

services:
  mysql:
    # 11.4.13
    image: mariadb@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    hostname: mysql
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: password

  slurmdbd:
    <<: *slurm
    command: [slurmdbd]
    hostname: slurmdbd
    environment:
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    depends_on: [mysql]

  slurmctld:
    <<: *slurm
    command: [slurmctld]
    hostname: slurmctld
    depends_on: [slurmdbd]

  c1: &worker
    <<: *slurm
    hostname: c1
    # slurmd 26.05 starts the cgroup plugin even with linuxproc and fails
    # on a read-only /sys/fs/cgroup otherwise.
    # Privileged: for disposable hosted runners only, never self-hosted.
    privileged: true
    init: true
    command:
      - bash
      - -c
      - until >/dev/tcp/slurmctld/6817; do sleep 1; done 2>/dev/null; exec /usr/sbin/slurmd -D
    depends_on: [slurmctld]

  c2:
    <<: *worker
    hostname: c2
