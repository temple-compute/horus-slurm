[project]
name = "horus-slurm"
dynamic = ["version"]
description = "Run Horus tasks on Slurm clusters"
requires-python = ">=3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "horus-runtime>=0.3.0",
]

[project.entry-points."horus.resource_probe"]
slurm_job = "horus_slurm.probe"

# ================
# Plugin entry-points
# ================
[project.entry-points."horus.target"]
slurm_target = "horus_slurm.target.slurm"

[project.entry-points."horus.event"]
slurm_job = "horus_slurm.events"

# The slurm_job probe (horus_slurm.probe) needs horus-resource-monitor's
# probe classes to import. Without this extra, that entry point just fails
# to load and is skipped (see AutoRegistry.init_registry) - the Slurm target
# still works, it just isn't probed for resource usage.
[project.optional-dependencies]
resource-monitor = ["horus-resource-monitor"]

[dependency-groups]
dev = [
  "babel~=2.0",
  "horus-slurm[resource-monitor]",
  "licenseheaders~=0.8",
  "mypy~=1.19",
  "pre_commit~=4.0",
  "pytest~=9.0",
  "pytest-asyncio~=1.3.0",
  "pytest-cov~=7.0",
  "ruff~=0.15",
  "types-PyYAML~=6.0",
  "uv-dynamic-versioning>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.29,<2.0", "uv-dynamic-versioning>=0.14.0,<1.0"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["horus_slurm"]

[tool.coverage.report]
omit = ["tests/*"]

[tool.hatch.build]
artifacts = [
  "src/horus_slurm/py.typed",
  "src/horus_slurm/locale/**/LC_MESSAGES/*.mo",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/horus_slurm"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["build", "dist"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = """
    --verbose
    --cov=src/horus_slurm
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
"""
minversion = "7.0"
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "PL",  # pylint
  "RUF",  # ruff-specific
  "ARG",  # ruff-arglint
  "SLF",  # ruff-slf
]
extend-select = ["T201"]  # Prevent use of print()

ignore = [
  "E203",  # Whitespace before ':', conflicts with formatter
  "D104",  # Missing docstring in __init__ (often redundant)
  "D205",  # 1 blank line required between summary line and description
  "D212",  # Multi-line docstring summary should start at the first line
  "D200",  # One-line docstring should fit on one line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests reach into privates on purpose, and their fixtures and expected
# values are literals by nature.
"tests/**/*.py" = ["SLF001", "PLR2004", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.1"

[tool.uv.sources]
horus-resource-monitor = { git = "https://github.com/temple-compute/horus-resource-monitor" }
