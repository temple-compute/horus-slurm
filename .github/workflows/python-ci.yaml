name: Python CI

on:
  pull_request:
    branches: [main, feat/shared-allocation]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.ACTIONS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Sync project dependencies
        run: uv sync --group dev

      - name: Lint with Ruff and mypy
        run: uv run make lint

      - name: Check translations
        run: uv run make babel-check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.ACTIONS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Sync project dependencies
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run make test

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: matrix.python-version == '3.13'
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 5

  integration:
    # The cluster runs privileged containers: hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ITEST_PROJECT: horus-slurm-itest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # The token lives only in this step's env, never in a git config the
      # PR's tests could read.
      - name: Sync project dependencies
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ACTIONS_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --group dev

      # runner.temp is not available in job-level env
      - name: Set integration dir
        run: echo "ITEST_DIR=$RUNNER_TEMP/itest" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: uv run make integration

      - name: Dump cluster logs
        if: failure()
        run: |
          docker compose -p "$ITEST_PROJECT" -f tests/integration/cluster/compose.yaml logs || true
          find "$ITEST_DIR" -name pilot.log -print -exec cat {} + || true

      - name: Tear down cluster
        if: always()
        run: make integration-down

      - name: Upload integration results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: integration-results
          path: integration-results.xml
          retention-days: 5
